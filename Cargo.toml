[package]
name = "coreai"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Apple Core AI (.aimodel) runtime binding and model kits for Rust — coremlit's counterpart for macOS 27+"
repository = "https://github.com/findit-studio/coreai"
homepage = "https://github.com/findit-studio/coreai"
documentation = "https://docs.rs/coreai"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["coreai", "apple", "macos", "machine-learning", "coremlit"]
categories = ["api-bindings", "os::macos-apis", "artificial-intelligence"]

[dependencies]

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
